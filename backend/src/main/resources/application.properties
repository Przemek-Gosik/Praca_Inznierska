# Active profiles: mysql,local OR postgres,local
# The 'local' profile loads your application-local.properties with secrets
spring.profiles.active=mysql,local

# Application settings
spring.application.name=brainUtrain
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT settings
jwt.expirationTime=3600000

# Swagger/OpenAPI
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springfox.documentation.swagger-ui.base-url=/docs
springfox.documentation.swagger.v2.use-model-v3=true

# Mail settings (password in application-local.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=brainutrain4@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
