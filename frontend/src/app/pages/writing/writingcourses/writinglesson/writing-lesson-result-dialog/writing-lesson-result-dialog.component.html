<p mat-dialog-title>Rezultat zadania</p>
<mat-dialog-content style="height:auto">
    <p data-test="points">Zdobyte punkty: {{score}}</p>
    <p data-test="number-of-chars">Ilość wpisanych znaków: {{typedLetters}}</p>
    <p data-test="precision">Precyzja: {{calculatePrecision()}}</p>
    <p>Czas: {{time}}s</p>
    <p>Prędkość wpisywania: {{calculateSpeed()}} znaków na minutę</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button [ngClass]="this.themeService.getTheme()" class="btn-form btn-large" [disabled]=saved (click)="saveOrUpdate()" *ngIf=loggedIn() data-test="save-button">Zapisz</button>
    <button mat-dialog-close [ngClass]="this.themeService.getTheme()" class="btn-form btn-large" data-test="close-button">Zamknij</button>
</mat-dialog-actions>
